const root=document.getElementById('slides');pages.forEach((p,i)=>{const section=document.createElement('section');section.className='slide';section.innerHTML=`<p class="eyebrow">SYSTEM ATLAS / ${String(i+1).padStart(2,'0')}</p><h1>${p.title}</h1><p class="subtitle">${p.subtitle}</p><div class="diagram">${svg(p.body)}</div><p class="caption">${p.caption}</p><div class="tags">${p.tags.map(t=>`<span>${t}</span>`).join('')}</div>`;root.append(section);const b=document.createElement('button');b.textContent=String(i+1).padStart(2,'0');b.setAttribute('aria-label',p.title);b.onclick=()=>show(i);document.getElementById('index').append(b)});let current=0;function show(i){current=Math.max(0,Math.min(9,i));document.querySelectorAll('.slide').forEach((s,j)=>s.classList.toggle('hidden',j!==current));document.querySelectorAll('#index button').forEach((b,j)=>{b.classList.toggle('active',j===current);b.setAttribute('aria-current',j===current?'step':'false')});document.getElementById('page-count').textContent=String(current+1).padStart(2,'0')+' / 10';document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===9;location.hash=String(current+1)}document.getElementById('next').onclick=()=>show(current+1);document.getElementById('prev').onclick=()=>show(current-1);document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.code==='Space'){e.preventDefault();show(current+1)}if(e.key==='ArrowRight'){e.preventDefault();show(current-1)}});show(Math.max(0,(parseInt(location.hash.slice(1),10)||1)-1));
